services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triadix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triadix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triadix_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-triadix_citas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triadix_user -d triadix_citas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

